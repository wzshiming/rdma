name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name || matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        # The toolchain's default: cgo on Linux, which the race detector needs,
        # the stubs on macOS and Windows. The bindings load rdma-core at run
        # time, so Linux installs the libraries and no development package.
        - os: ubuntu-latest
          apt: libibverbs1 librdmacm1t64
          flags: -race
          packages: ./...
        - os: macos-latest
          flags: -race
          packages: ./...
        - os: windows-latest
          flags: -race
          packages: ./...
        # No cgo on linux/amd64 and linux/arm64 with the libraries present at
        # run time only. The race detector needs cgo, so it stays out.
        - name: linux/amd64 without cgo
          os: ubuntu-24.04
          cgo: 0
          apt: libibverbs1 librdmacm1t64
          packages: ./...
        - name: linux/arm64 without cgo
          os: ubuntu-24.04-arm
          cgo: 0
          apt: libibverbs1 librdmacm1t64
          packages: ./...
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    defaults:
      run:
        shell: bash
    steps:
    # Windows checks out CRLF by default, which gofmt reports as unformatted.
    - name: Keep LF line endings
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Show the platform
      run: uname -m && go version && go env GOOS GOARCH CGO_ENABLED

    - name: Install RDMA packages
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

    - name: Format
      run: test -z "$(gofmt -l . | tee /dev/stderr)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ${{ matrix.flags }} -count=1 ${{ matrix.packages }}

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Build without cgo
      run: CGO_ENABLED=0 go build ./...

    - name: Cross-platform vet
      # The default shell (bash -e) stops the loop at the first failing target.
      # CGO_ENABLED=0 so that no target needs a C toolchain: the six Linux
      # architectures the bindings support, then linux/386 and the other
      # systems, which get the stubs.
      run: |
        for target in \
          linux/amd64 linux/arm64 linux/loong64 linux/ppc64le linux/riscv64 linux/s390x \
          linux/386 darwin/amd64 darwin/arm64 \
          windows/amd64 windows/386 windows/arm64 \
          freebsd/amd64 openbsd/amd64 netbsd/amd64 dragonfly/amd64 \
          solaris/amd64 illumos/amd64 aix/ppc64 plan9/amd64 \
          js/wasm wasip1/wasm android/arm64; do
          echo "$target"
          CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
        done

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Soft-RoCE gets a netdev of its own: some runners carry a hardware RDMA
      # device on eth0 (Microsoft MANA) that would share eth0's IP, and rdma_cm
      # picks the device by source IP.
      RXE_NETDEV: rxe-dummy0
      RXE_IP: 10.200.0.1
      # Ubuntu 24.04 ships rdma-core 50.0, whose rsockets service thread polls
      # a freed descriptor array once a fourth rsocket registers (fixed in 53
      # by 24061f015bd9), so the many-connection tests need a newer librdmacm:
      # the release tarball below is built and installed under /usr/local.
      RDMA_CORE_VERSION: "66.0"
    steps:
    # The whole history, so that the benchmarks find their baseline.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Install Ubuntu's rdma-core
      # The udev rules and module configuration come from the distribution;
      # headers and libraries come from the source build below, so the -dev
      # packages stay out: gcc searches /usr/lib/<arch> before ld's own
      # /usr/local/lib/<arch> and would link the 50.0 librdmacm.so instead.
      run: |
        sudo apt-get update
        sudo apt-get install -y rdma-core ibverbs-utils rdmacm-utils ibverbs-providers iproute2
        # rdma_rxe.ko ships in linux-modules-extra on Ubuntu.
        sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true

    - name: Install the C compilers of the layout check
      # The layout tests compile the rdma-core headers with <triplet>-gcc for
      # every supported architecture: the native gcc and Ubuntu's cross gcc.
      # Noble has no unversioned gcc-loongarch64-linux-gnu, so the versioned
      # package supplies that compiler and a link gives it the same name.
      shell: bash
      run: |
        sudo apt-get install -y gcc gcc-aarch64-linux-gnu gcc-14-loongarch64-linux-gnu gcc-powerpc64le-linux-gnu gcc-riscv64-linux-gnu gcc-s390x-linux-gnu
        sudo ln -s /usr/bin/loongarch64-linux-gnu-gcc-14 /usr/local/bin/loongarch64-linux-gnu-gcc
        for cc in x86_64-linux-gnu-gcc aarch64-linux-gnu-gcc loongarch64-linux-gnu-gcc powerpc64le-linux-gnu-gcc riscv64-linux-gnu-gcc s390x-linux-gnu-gcc; do
          command -v "$cc"
          "$cc" --version | head -1
        done

    - name: Identify the runner image
      id: image
      run: echo "id=$ImageOS-$ImageVersion" | tee -a "$GITHUB_OUTPUT"

    - name: Restore the rdma-core build
      id: rdma-core-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/rdma-core-install
        key: rdma-core-${{ env.RDMA_CORE_VERSION }}-${{ steps.image.outputs.id }}

    - name: Build rdma-core
      if: steps.rdma-core-cache.outputs.cache-hit != 'true'
      # The libraries go into lib/<arch>: ld and ld.so search
      # /usr/local/lib/<arch> ahead of /usr/lib/<arch> but /usr/local/lib only
      # last, so this directory wins at link time and at run time alike. The
      # providers (rxe among them) follow the libdir, their configuration
      # goes to /usr/local/etc/libibverbs.d.
      run: |
        sudo apt-get install -y build-essential cmake ninja-build pkg-config libnl-3-dev libnl-route-3-dev libudev-dev python3
        curl -fsSL -o /tmp/rdma-core.tar.gz "https://github.com/linux-rdma/rdma-core/releases/download/v$RDMA_CORE_VERSION/rdma-core-$RDMA_CORE_VERSION.tar.gz"
        tar -C /tmp -xzf /tmp/rdma-core.tar.gz
        grep -q "^set(PACKAGE_VERSION \"$RDMA_CORE_VERSION\")" "/tmp/rdma-core-$RDMA_CORE_VERSION/CMakeLists.txt"
        cmake -S "/tmp/rdma-core-$RDMA_CORE_VERSION" -B /tmp/rdma-core-build -GNinja \
          -DCMAKE_BUILD_TYPE=Release -DNO_PYVERBS=1 -DNO_MAN_PAGES=1 \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_INSTALL_LIBDIR="lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
        ninja -C /tmp/rdma-core-build
        DESTDIR="$HOME/rdma-core-install" ninja -C /tmp/rdma-core-build install

    - name: Save the rdma-core build
      if: steps.rdma-core-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/rdma-core-install
        key: ${{ steps.rdma-core-cache.outputs.cache-primary-key }}

    - name: Install the rdma-core build
      run: |
        sudo cp -a --no-preserve=ownership "$HOME/rdma-core-install/." /
        sudo ldconfig

    - name: Load rdma_rxe
      run: |
        if ! sudo modprobe rdma_rxe; then
          uname -a
          modinfo rdma_rxe || true
          siw_rc=0
          sudo modprobe siw || siw_rc=$?
          echo "siw_rc=$siw_rc"
          ls "/lib/modules/$(uname -r)/kernel/drivers/infiniband/" || true
          ls "/lib/modules/$(uname -r)/kernel/drivers/infiniband/sw/" || true
          exit 1
        fi
        sudo modprobe rdma_ucm || true

    - name: Add rxe0
      run: |
        sudo ip link add "$RXE_NETDEV" type dummy
        sudo ip addr add "$RXE_IP/24" dev "$RXE_NETDEV"
        sudo ip link set "$RXE_NETDEV" up
        sudo rdma link add rxe0 type rxe netdev "$RXE_NETDEV"
        ip -o -4 addr
        rdma link
        ibv_devinfo -v
        ls -l /dev/infiniband

    - name: Show the rdma-core in use
      # Everything RDMA the tests touch must come from the source build: the
      # tools on PATH and the files the dynamic loader resolves the two
      # sonames to, which is what a process gets however it links them.
      shell: bash
      run: |
        arch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
        ldconfig -p | grep -E 'librdmacm|libibverbs'
        ls -l /usr/local/lib/"$arch"/librdmacm.so*
        command -v rstream
        test "$(command -v rstream)" = /usr/local/bin/rstream
        ibv_devinfo -d rxe0 | head
        python3 - <<'EOF' | tee /tmp/libraries
        import ctypes
        for soname in "libibverbs.so.1", "librdmacm.so.1":
            ctypes.CDLL(soname)
        paths = {line.split()[-1] for line in open("/proc/self/maps") if "/libibverbs.so" in line or "/librdmacm.so" in line}
        print("\n".join(sorted(paths)))
        EOF
        test "$(grep -c . /tmp/libraries)" -eq 2
        if grep -v "^/usr/local/lib/$arch/" /tmp/libraries; then
          echo "the dynamic loader resolves an RDMA library outside /usr/local/lib/$arch" >&2
          exit 1
        fi

    - name: rping loopback
      run: |
        timeout 60 rping -s -a "$RXE_IP" -C 5 -v &
        server=$!
        sleep 1
        timeout 60 rping -c -a "$RXE_IP" -C 5 -v
        wait "$server" || echo "rping server exited with $?"

    - name: Test
      env:
        RDMA_TEST_DEVICE: rxe0
        RDMA_TEST_LAYOUT_ARCHES: amd64,arm64,loong64,ppc64le,riscv64,s390x
      # Registered memory is pinned and counts against RLIMIT_MEMLOCK, whose
      # 8 MiB default holds a handful of connections at most. Both runs are
      # verbose so that the transfer timings the tests log are on record and
      # each round shows the tests it ran. The second runs the same module
      # without cgo and with freed memory clobbered, so that memory handed to
      # the libraries and freed too early shows up.
      run: |
        sudo prlimit --pid $$ --memlock=unlimited:unlimited
        ulimit -l
        RDMA_TEST_REQUIRE=1 go test -race -count=1 -v ./...
        CGO_ENABLED=0 RDMA_TEST_REQUIRE=1 GODEBUG=clobberfree=1 go test -count=1 -v ./...

    - name: Compare the benchmarks
      env:
        RDMA_TEST_DEVICE: rxe0
        # The tip of the branch before a push, all zeros when the push makes
        # the branch; a new branch is compared with the merge base with
        # master instead, and so are a pull request and a forced push whose
        # previous tip is gone.
        PREVIOUS_TIP: ${{ github.event_name == 'push' && github.event.before || '' }}
      # Ten rounds without the race detector, each of which runs the native
      # engine on the baseline, on this tree and on the baseline again, and
      # then every engine on this tree, so that trees and engines take turns
      # on this runner; BenchmarkRXEDuplex runs on the native engine alone,
      # as librdmacm's at times wedged the process on rxe. A pass that fails
      # or hangs fails the step; the figures never do. The log repeats the
      # summary, which the API does not serve.
      shell: bash
      run: |
        sudo prlimit --pid $$ --memlock=unlimited:unlimited
        base=$(git merge-base HEAD origin/master) why="the merge base with master"
        if git cat-file -e "$PREVIOUS_TIP^{commit}" 2>/dev/null; then base=$PREVIOUS_TIP why="the tip of the branch before the push"; fi
        echo "baseline: $base, $why"
        hack/benchcompare.sh -base "$base" -out "$RUNNER_TEMP/benchmarks"
        cat "$RUNNER_TEMP/benchmarks/summary.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the benchmark output
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-comparison
        path: ${{ runner.temp }}/benchmarks
        if-no-files-found: error
