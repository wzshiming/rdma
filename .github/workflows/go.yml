name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name || matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        # The toolchain's default: cgo against the development packages on
        # Linux, the stubs on macOS and Windows.
        - os: ubuntu-latest
          apt: libibverbs-dev librdmacm-dev
          flags: -race
          packages: ./...
        - os: macos-latest
          flags: -race
          packages: ./...
        - os: windows-latest
          flags: -race
          packages: ./...
        # No cgo on linux/amd64 and linux/arm64 with the libraries present at
        # run time only. The race detector needs cgo, so it stays out; the
        # commands keep their build tags until their tests run without cgo,
        # so the library packages alone.
        - name: linux/amd64 without cgo
          os: ubuntu-24.04
          cgo: 0
          apt: libibverbs1 librdmacm1t64
          packages: . ./rsocket/... ./verbs/... ./cm/... ./internal/...
        - name: linux/arm64 without cgo
          os: ubuntu-24.04-arm
          cgo: 0
          apt: libibverbs1 librdmacm1t64
          packages: . ./rsocket/... ./verbs/... ./cm/... ./internal/...
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    defaults:
      run:
        shell: bash
    steps:
    # Windows checks out CRLF by default, which gofmt reports as unformatted.
    - name: Keep LF line endings
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Show the platform
      run: uname -m && go version && go env GOOS GOARCH CGO_ENABLED

    - name: Install RDMA packages
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

    - name: Format
      run: test -z "$(gofmt -l . | tee /dev/stderr)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ${{ matrix.flags }} -count=1 ${{ matrix.packages }}

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Build without cgo
      run: CGO_ENABLED=0 go build ./...

    - name: Cross-platform vet
      # The default shell (bash -e) stops the loop at the first failing target.
      # CGO_ENABLED=0 so that no target needs a C toolchain: the six Linux
      # architectures the bindings support, then linux/386 and the other
      # systems, which get the stubs.
      run: |
        for target in \
          linux/amd64 linux/arm64 linux/loong64 linux/ppc64le linux/riscv64 linux/s390x \
          linux/386 darwin/amd64 darwin/arm64 \
          windows/amd64 windows/386 windows/arm64 \
          freebsd/amd64 openbsd/amd64 netbsd/amd64 dragonfly/amd64 \
          solaris/amd64 illumos/amd64 aix/ppc64 plan9/amd64 \
          js/wasm wasip1/wasm android/arm64; do
          echo "$target"
          CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
        done

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Soft-RoCE gets a netdev of its own: some runners carry a hardware RDMA
      # device on eth0 (Microsoft MANA) that would share eth0's IP, and rdma_cm
      # picks the device by source IP.
      RXE_NETDEV: rxe-dummy0
      RXE_IP: 10.200.0.1
      # Ubuntu 24.04 ships rdma-core 50.0, whose rsockets service thread polls
      # a freed descriptor array once a fourth rsocket registers (fixed in 53
      # by 24061f015bd9), so the many-connection tests need a newer librdmacm:
      # the release tarball below is built and installed under /usr/local.
      RDMA_CORE_VERSION: "66.0"
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Install Ubuntu's rdma-core
      # The udev rules and module configuration come from the distribution;
      # headers and libraries come from the source build below, so the -dev
      # packages stay out: gcc searches /usr/lib/<arch> before ld's own
      # /usr/local/lib/<arch> and would link the 50.0 librdmacm.so instead.
      run: |
        sudo apt-get update
        sudo apt-get install -y rdma-core ibverbs-utils rdmacm-utils ibverbs-providers iproute2
        # rdma_rxe.ko ships in linux-modules-extra on Ubuntu.
        sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true

    - name: Identify the runner image
      id: image
      run: echo "id=$ImageOS-$ImageVersion" | tee -a "$GITHUB_OUTPUT"

    - name: Restore the rdma-core build
      id: rdma-core-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/rdma-core-install
        key: rdma-core-${{ env.RDMA_CORE_VERSION }}-${{ steps.image.outputs.id }}

    - name: Build rdma-core
      if: steps.rdma-core-cache.outputs.cache-hit != 'true'
      # The libraries go into lib/<arch>: ld and ld.so search
      # /usr/local/lib/<arch> ahead of /usr/lib/<arch> but /usr/local/lib only
      # last, so this directory wins at link time and at run time alike. The
      # providers (rxe among them) follow the libdir, their configuration
      # goes to /usr/local/etc/libibverbs.d.
      run: |
        sudo apt-get install -y build-essential cmake ninja-build pkg-config libnl-3-dev libnl-route-3-dev libudev-dev python3
        curl -fsSL -o /tmp/rdma-core.tar.gz "https://github.com/linux-rdma/rdma-core/releases/download/v$RDMA_CORE_VERSION/rdma-core-$RDMA_CORE_VERSION.tar.gz"
        tar -C /tmp -xzf /tmp/rdma-core.tar.gz
        grep -q "^set(PACKAGE_VERSION \"$RDMA_CORE_VERSION\")" "/tmp/rdma-core-$RDMA_CORE_VERSION/CMakeLists.txt"
        cmake -S "/tmp/rdma-core-$RDMA_CORE_VERSION" -B /tmp/rdma-core-build -GNinja \
          -DCMAKE_BUILD_TYPE=Release -DNO_PYVERBS=1 -DNO_MAN_PAGES=1 \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_INSTALL_LIBDIR="lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
        ninja -C /tmp/rdma-core-build
        DESTDIR="$HOME/rdma-core-install" ninja -C /tmp/rdma-core-build install

    - name: Save the rdma-core build
      if: steps.rdma-core-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/rdma-core-install
        key: ${{ steps.rdma-core-cache.outputs.cache-primary-key }}

    - name: Install the rdma-core build
      run: |
        sudo cp -a --no-preserve=ownership "$HOME/rdma-core-install/." /
        sudo ldconfig

    - name: Load rdma_rxe
      run: |
        if ! sudo modprobe rdma_rxe; then
          uname -a
          modinfo rdma_rxe || true
          siw_rc=0
          sudo modprobe siw || siw_rc=$?
          echo "siw_rc=$siw_rc"
          ls "/lib/modules/$(uname -r)/kernel/drivers/infiniband/" || true
          ls "/lib/modules/$(uname -r)/kernel/drivers/infiniband/sw/" || true
          exit 1
        fi
        sudo modprobe rdma_ucm || true

    - name: Add rxe0
      run: |
        sudo ip link add "$RXE_NETDEV" type dummy
        sudo ip addr add "$RXE_IP/24" dev "$RXE_NETDEV"
        sudo ip link set "$RXE_NETDEV" up
        sudo rdma link add rxe0 type rxe netdev "$RXE_NETDEV"
        ip -o -4 addr
        rdma link
        ibv_devinfo -v
        ls -l /dev/infiniband

    - name: Show the rdma-core in use
      # Everything RDMA the tests touch must come from the source build.
      run: |
        arch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
        ldconfig -p | grep -E 'librdmacm|libibverbs'
        ls -l /usr/local/lib/"$arch"/librdmacm.so*
        command -v rstream
        test "$(command -v rstream)" = /usr/local/bin/rstream
        ibv_devinfo -d rxe0 | head
        go test -c -o /tmp/rdma.test .
        ldd /tmp/rdma.test | grep -E 'rdmacm|ibverbs'
        if ldd /tmp/rdma.test | grep -E 'rdmacm|ibverbs' | grep -v "/usr/local/lib/$arch/"; then
          echo "the test binary loads an RDMA library from outside /usr/local/lib/$arch" >&2
          exit 1
        fi

    - name: rping loopback
      run: |
        timeout 60 rping -s -a "$RXE_IP" -C 5 -v &
        server=$!
        sleep 1
        timeout 60 rping -c -a "$RXE_IP" -C 5 -v
        wait "$server" || echo "rping server exited with $?"

    - name: Test
      env:
        RDMA_TEST_DEVICE: rxe0
      # Registered memory is pinned and counts against RLIMIT_MEMLOCK, whose
      # 8 MiB default holds a handful of connections at most. The first run is
      # verbose so that the transfer timings the tests log are on record.
      run: |
        sudo prlimit --pid $$ --memlock=unlimited:unlimited
        ulimit -l
        RDMA_TEST_REQUIRE=1 go test -race -count=1 -v ./...
        RDMA_TEST_REQUIRE=1 GOEXPERIMENT=cgocheck2 go test -count=1 ./...
